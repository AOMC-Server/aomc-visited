plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.version
group = project.group

base {
	archivesName = 'aomc-webmapper'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
		}
	}

	mods {
		aomc_visited {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

configurations {
	xaeroWorldMap { transitive = false }
}

def extractXaeroLib = tasks.register("extractXaeroLib", Sync) {
	from({ zipTree(configurations.xaeroWorldMap.singleFile) }) {
		include "META-INF/jarjar/xaerolib-*.jar"
		eachFile { path = "xaerolib.jar" }
	}
	includeEmptyDirs = false
	into layout.buildDirectory.dir("xaero-lib")
}

dependencies {
	// Xaero's World Map is All Rights Reserved: compile against it from Modrinth, never bundle it, and
	// only call into it when it's installed. Its xaerolib is nested inside the jar (NeoForge's jar-in-jar).
	xaeroWorldMap "maven.modrinth:xaeros-world-map:neoforge-${project.minecraft_version}-${project.xaero_worldmap_version}"
	compileOnly files(configurations.xaeroWorldMap)
	compileOnly files(layout.buildDirectory.file("xaero-lib/xaerolib.jar")).builtBy(extractXaeroLib)
}

processResources {
	def props = [version: project.version, minecraft_version: project.minecraft_version,
			xaero_worldmap_version: project.xaero_worldmap_version]
	inputs.properties props

	filesMatching("META-INF/neoforge.mods.toml") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
}
